name: Flutter Multi-Platform Release

on:
  push:
    tags:
      - "v*" # Run when pushing version tags like v1.0.0
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------------
  # ANDROID + WEB (Ubuntu runner)
  # ------------------------------------------------------------------------
  build-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-pub-cache

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Android licenses
        run: flutter doctor --android-licenses

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # ------- Android ------
      - name: Build Android APK
        run: flutter build apk --release --verbose

      - name: Build Android AAB
        run: flutter build appbundle --release --verbose

      # ------- Web ----------
      - name: Build Web
        run: flutter build web --release --pwa-strategy none

      # ------- Package Ubuntu Artifacts -------
      - name: Package Ubuntu Artifacts
        run: |
          mkdir -p artifacts
          # strip leading "v" from tag
          V=${GITHUB_REF_NAME#v}

          # Android
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/android-$V.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/android-$V.aab

          # Web - create a clean zip without full paths
          cd build/web
          zip -r ../../artifacts/web-$V.zip .

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-artifacts-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30

  # ------------------------------------------------------------------------
  # WINDOWS BUILD
  # ------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-pub-cache

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows
        run: flutter build windows --release --verbose

      - name: Package Windows
        run: |
          # strip leading "v" from tag in PowerShell
          $V = $Env:GITHUB_REF_NAME -replace '^v',''
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          
          # Create a proper Windows distribution package
          $SourceDir = "build\windows\runner\Release"
          $ZipFile = "artifacts\windows-$V.zip"
          
          # Include all necessary files for distribution
          Get-ChildItem -Path $SourceDir -Recurse | 
            Where-Object { $_.Name -like "*.exe" -or $_.Name -like "*.dll" -or $_.Name -like "data" } |
            Compress-Archive -DestinationPath $ZipFile -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30

  # ------------------------------------------------------------------------
  # iOS + macOS (Mac Runner)
  # ------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-pub-cache

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -v 1.15.2
          pod setup

      - name: Install iOS dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # -------- iOS IPA --------
      - name: Build iOS (Unsigned)
        run: |
          flutter build ipa --release --no-codesign --verbose

      # -------- macOS APP --------
      - name: Build macOS
        run: flutter build macos --release --verbose

      - name: Package iOS + macOS artifacts
        run: |
          mkdir -p artifacts
          V=${GITHUB_REF_NAME#v}

          # iOS - copy IPA if it exists
          if [ -f build/ios/ipa/*.ipa ]; then
            cp build/ios/ipa/*.ipa artifacts/ios-$V.ipa
          fi

          # macOS - package the app bundle
          cd build/macos/Build/Products/Release
          find . -name "*.app" -exec zip -r ../../../../artifacts/macos-$V.zip {} \;

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-artifacts-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30

  # ------------------------------------------------------------------------
  # FINAL RELEASE CREATION AFTER ALL JOBS
  # ------------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    needs: [build-ubuntu, build-windows, build-macos]
    # Only create release if all previous jobs succeeded
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts
          pattern: '*'
          merge-multiple: true

      - name: List downloaded artifacts
        run: find ./all-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Multi-platform Flutter release for version ${{ github.ref_name }}.
            
            **Platforms included:**
            - Android (APK + AAB)
            - iOS (IPA - unsigned)
            - macOS
            - Windows
            - Web
            
            **Build Date:** ${{ github.event.head_commit.timestamp }}
          files: |
            all-artifacts/**/*.apk
            all-artifacts/**/*.aab
            all-artifacts/**/*.ipa
            all-artifacts/**/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}