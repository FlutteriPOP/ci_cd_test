name: Flutter Multi-Platform Release

on:
  push:
    tags:
      - "v*" # Run when pushing version tags like v1.0.0
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------------
  # ANDROID + WEB (Ubuntu runner)
  # ------------------------------------------------------------------------
  build-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-pub-cache

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Android licenses
        run: |
          yes | sdkmanager --licenses || true
          flutter doctor --android-licenses

      - name: Analyze code
        run: flutter analyze

      # ------- Android ------
      - name: Build Android APK
        run: flutter build apk --release --verbose

      - name: Build Android AAB
        run: flutter build appbundle --release --verbose

      # ------- Web ----------
      - name: Build Web
        run: flutter build web --release --pwa-strategy none

      # ------- Package Ubuntu Artifacts -------
      - name: Package Ubuntu Artifacts
        run: |
          mkdir -p artifacts
          V=${GITHUB_REF_NAME#v}

          # Android
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/android-$V.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/android-$V.aab

          # Web
          cd build/web
          zip -r ../../artifacts/web-$V.zip .

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-artifacts-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30

  # ------------------------------------------------------------------------
  # WINDOWS BUILD
  # ------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-pub-cache

      - name: Check Windows support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build Windows
        run: flutter build windows --release --verbose

      - name: Package Windows
        run: |
          $V = $Env:GITHUB_REF_NAME -replace '^v',''
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "build\windows\runner\Release\*" -DestinationPath "artifacts\windows-$V.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30

  # ------------------------------------------------------------------------
  # macOS BUILD (Only if macOS is supported)
  # ------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    # Only run if macOS directory exists
    if: hashFiles('macos/Podfile') != ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-pub-cache

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod setup

      - name: Install macOS dependencies
        run: |
          cd macos
          pod install --repo-update

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build macOS
        run: flutter build macos --release --verbose

      - name: Package macOS artifacts
        run: |
          mkdir -p artifacts
          V=${GITHUB_REF_NAME#v}
          
          # macOS - package the app bundle
          cd build/macos/Build/Products/Release
          find . -name "*.app" -type d -exec zip -r ../../../../artifacts/macos-$V.zip {} \;

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30

  # ------------------------------------------------------------------------
  # iOS BUILD (Only if iOS is supported)
  # ------------------------------------------------------------------------
  build-ios:
    runs-on: macos-latest
    # Only run if iOS directory exists
    if: hashFiles('ios/Podfile') != ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-pub-cache

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod setup

      - name: Install iOS dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build iOS (Unsigned)
        run: flutter build ipa --release --no-codesign --verbose

      - name: Package iOS artifacts
        run: |
          mkdir -p artifacts
          V=${GITHUB_REF_NAME#v}

          # iOS - copy IPA if it exists
          if ls build/ios/ipa/*.ipa 1> /dev/null 2>&1; then
            cp build/ios/ipa/*.ipa artifacts/ios-$V.ipa
          else
            echo "No IPA file found"
            # Create a placeholder or build the app bundle instead
            flutter build ios --release --no-codesign
            cd build/ios/iphoneos
            find . -name "*.app" -type d -exec zip -r ../../../artifacts/ios-$V.zip {} \;
          fi

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30

  # ------------------------------------------------------------------------
  # LINUX BUILD (Optional - if Linux support is enabled)
  # ------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    # Only run if Linux desktop is supported
    if: hashFiles('linux/') != ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-pub-cache

      - name: Check Linux support
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
          flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build Linux
        run: flutter build linux --release --verbose

      - name: Package Linux artifacts
        run: |
          mkdir -p artifacts
          V=${GITHUB_REF_NAME#v}
          cd build/linux/x64/release/bundle
          zip -r ../../../../artifacts/linux-$V.zip .

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30

  # ------------------------------------------------------------------------
  # FINAL RELEASE CREATION AFTER ALL JOBS
  # ------------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    needs: [build-ubuntu, build-windows, build-macos, build-ios, build-linux]
    # Only create release if at least one build succeeded
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-artifacts
          pattern: '*'
          merge-multiple: true

      - name: List downloaded artifacts
        run: find ./all-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Multi-platform Flutter release for version ${{ github.ref_name }}.
            
            **Built Platforms:**
            - ✅ Android (APK + AAB)
            - ✅ Web
            - ✅ Windows
            ${{ needs.build-macos.result == 'success' && '- ✅ macOS' || '- ❌ macOS (Not built)' }}
            ${{ needs.build-ios.result == 'success' && '- ✅ iOS' || '- ❌ iOS (Not built)' }}
            ${{ needs.build-linux.result == 'success' && '- ✅ Linux' || '- ❌ Linux (Not built)' }}
            
            **Build Date:** ${{ github.event.head_commit.timestamp }}
          files: |
            all-artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}