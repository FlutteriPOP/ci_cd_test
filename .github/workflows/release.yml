name: Flutter Multi-Platform Release

on:
  push:
    tags:
      - "v*" # Run when pushing version tags like v1.0.0
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------------
  # ANDROID + WEB (Ubuntu runner)
  # ------------------------------------------------------------------------
  build-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # ------- Android ------
      - name: Build Android APK + AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release

      # ------- Web ----------
      - name: Build Web
        run: flutter build web --release

      # ------- Package Ubuntu Artifacts -------
      - name: Package Ubuntu Artifacts
        run: |
          mkdir -p artifacts
          # strip leading "v" from tag
          V=${GITHUB_REF_NAME#v}

          # Android
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/android-$V.apk || true
          cp build/app/outputs/bundle/release/app-release.aab artifacts/android-$V.aab || true

          # Web
          zip -r artifacts/web-$V.zip build/web/

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-artifacts-${{ github.ref_name }}
          path: artifacts/

  # ------------------------------------------------------------------------
  # WINDOWS BUILD
  # ------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        run: |
          # strip leading "v" from tag in PowerShell
          $V = $Env:GITHUB_REF_NAME -replace '^v',''
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path build/windows/runner/Release/* -DestinationPath artifacts/windows-$V.zip -Force
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts-${{ github.ref_name }}
          path: artifacts/

  # ------------------------------------------------------------------------
  # iOS + macOS (Mac Runner)
  # ------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios
          pod install --repo-update

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # -------- iOS IPA --------
      - name: Build iOS (Unsigned)
        run: flutter build ipa --release --no-codesign

      # -------- macOS APP --------
      - name: Build macOS
        run: flutter build macos --release

      - name: Package iOS + macOS
        run: |
          mkdir -p artifacts
          V=${GITHUB_REF_NAME#v}

          # iOS
          cp build/ios/ipa/*.ipa artifacts/ios-$V.ipa || true

          # macOS
          zip -r artifacts/macos-$V.zip build/macos/Build/Products/Release/*.app || true

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-artifacts-${{ github.ref_name }}
          path: artifacts/

  # ------------------------------------------------------------------------
  # FINAL RELEASE CREATION AFTER ALL JOBS
  # ------------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    needs: [build-ubuntu, build-windows, build-macos]

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}